plugins {
    id 'java'
    id "io.spring.dependency-management" version "1.1.7"
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'nu.studer.jooq' version '10.2.1'
}

group 'ru.romangr'
version '2.0-SNAPSHOT'

repositories {
    mavenCentral()
}

tasks.register('createCommitProperties') {
    def outputFile = layout.buildDirectory.file('resources/main/build.properties')

    outputs.file(outputFile)

    doLast {
        def gitRevision = providers.exec {
            commandLine 'git', 'log', '--pretty=%h %ci %s', '-1'
        }.standardOutput.asText.get().trim()

        def file = outputFile.get().asFile
        file.parentFile.mkdirs()

        file.text = "GIT_REVISION=${gitRevision}\n"
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'ru.romangr.catbot.Runner'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    dependsOn createCommitProperties
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation('javax.xml:jaxb-api:2.1')
    implementation('org.springframework:spring-web')
    implementation('com.fasterxml.jackson.core:jackson-core')
    implementation('com.fasterxml.jackson.core:jackson-annotations')
    implementation('com.fasterxml.jackson.core:jackson-databind')
    implementation('com.fasterxml.jackson.module:jackson-module-kotlin')
    implementation('org.apache.commons:commons-lang3')
    implementation('ru.romangr:exceptional:0.4.0')
    implementation('org.slf4j:slf4j-api')
    implementation('ch.qos.logback:logback-classic')
    implementation('com.google.guava:guava:30.0-jre')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.21"
    implementation 'org.jooq:jooq:3.16.2'
    implementation 'org.jooq:jooq-meta:3.16.2'
    implementation 'org.jooq:jooq-codegen:3.16.2'
    implementation 'org.xerial:sqlite-jdbc:3.36.0.3'
    jooqGenerator 'org.xerial:sqlite-jdbc:3.36.0.3'


    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')

    testImplementation('org.hamcrest:hamcrest-core')
    testImplementation('org.assertj:assertj-core')
    testImplementation('org.springframework:spring-test')
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('org.mockito:mockito-core')
    testImplementation('org.mockito:mockito-junit-jupiter')
}

jooq {
  version = '3.15.1'

  configurations {
    main {
      generateSchemaSourceOnCompilation = false
      generationTool {
        logging = org.jooq.meta.jaxb.Logging.WARN
        jdbc {
          driver = 'org.sqlite.JDBC'
          url = 'jdbc:sqlite:./catbot_db.sqlite'
          user = 'root'
          password = ''
        }
        generator {
          name = 'org.jooq.codegen.DefaultGenerator'
          database {
            name = 'org.jooq.meta.sqlite.SQLiteDatabase'
          }
          generate {
            deprecated = false
            records = false
            immutablePojos = false
            fluentSetters = false
          }
          target {
            packageName = 'ru.romangr.catbot'
            directory = 'src/generated/jooq'
          }
          strategy.name = "org.jooq.codegen.DefaultGeneratorStrategy"
        }
      }
    }
  }
}
