plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21'
    id 'org.graalvm.buildtools.native' version '1.1.20'
    id 'nu.studer.jooq' version '10.2.1'
}

group 'ru.romangr'
version '2.0-SNAPSHOT'

repositories {
    mavenCentral()
}

tasks.register('createCommitProperties') {
    def outputFile = layout.buildDirectory.file('resources/main/build.properties')

    outputs.file(outputFile)

    // GIT_REVISION can be supplied from outside (e.g. a Docker build without .git)
    def gitRevisionFromEnv = providers.environmentVariable('GIT_REVISION')
    inputs.property('gitRevisionFromEnv', gitRevisionFromEnv.orElse(''))
    outputs.upToDateWhen { false }

    doLast {
        def gitRevision = gitRevisionFromEnv.getOrElse('').trim()
        if (!gitRevision) {
            gitRevision = providers.exec {
                commandLine 'git', 'log', '--pretty=%h %ci %s', '-1'
            }.standardOutput.asText.get().trim()
        }

        def file = outputFile.get().asFile
        file.parentFile.mkdirs()

        file.text = "GIT_REVISION=${gitRevision}\n"
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'ru.romangr.catbot.Runner'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

test {
    useJUnitPlatform()
}

// build.properties is written straight into the resources output, so make sure every
// consumer of the main classes (jar, nativeCompile, tests) sees it.
createCommitProperties.mustRunAfter processResources
classes.dependsOn createCommitProperties

graalvmNative {
    toolchainDetection = false
    metadataRepository {
        enabled = true
    }
    binaries {
        main {
            imageName = 'catbot'
            mainClass = 'ru.romangr.catbot.Runner'
            buildArgs.addAll(
                // Link everything statically except glibc: the SQLite JNI library is
                // loaded at runtime, which a fully static (musl) binary cannot do.
                '--static-nolibc',
                '--no-fallback',
                // sqlite-jdbc loads its JNI library via System.load
                '--enable-native-access=ALL-UNNAMED',
                '-R:MaxHeapSize=50m',
                '-H:+ReportExceptionStackTraces'
            )
        }
    }
}

dependencies {
    implementation('javax.xml:jaxb-api:2.1')
    implementation('org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0')
    implementation('org.apache.commons:commons-lang3:3.20.0')
    implementation('ru.romangr:exceptional:0.4.0')
    implementation('org.slf4j:slf4j-api:2.0.19')
    implementation('ch.qos.logback:logback-classic:1.6.8')
    implementation('com.google.guava:guava:30.0-jre')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.21"
    implementation 'org.jooq:jooq:3.16.2'
    implementation 'org.jooq:jooq-meta:3.16.2'
    implementation 'org.jooq:jooq-codegen:3.16.2'
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    jooqGenerator 'org.xerial:sqlite-jdbc:3.54.1.0'


    compileOnly('org.projectlombok:lombok:1.18.46')
    annotationProcessor('org.projectlombok:lombok:1.18.46')

    testImplementation(platform('org.junit:junit-bom:6.0.3'))
    testImplementation('org.hamcrest:hamcrest-core:3.0')
    testImplementation('org.assertj:assertj-core:3.27.7')
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testImplementation('org.mockito:mockito-junit-jupiter:5.23.0')
}

jooq {
  version = '3.15.1'

  configurations {
    main {
      generateSchemaSourceOnCompilation = false
      generationTool {
        logging = org.jooq.meta.jaxb.Logging.WARN
        jdbc {
          driver = 'org.sqlite.JDBC'
          url = 'jdbc:sqlite:./catbot_db.sqlite'
          user = 'root'
          password = ''
        }
        generator {
          name = 'org.jooq.codegen.DefaultGenerator'
          database {
            name = 'org.jooq.meta.sqlite.SQLiteDatabase'
          }
          generate {
            deprecated = false
            records = false
            immutablePojos = false
            fluentSetters = false
          }
          target {
            packageName = 'ru.romangr.catbot'
            directory = 'src/generated/jooq'
          }
          strategy.name = "org.jooq.codegen.DefaultGeneratorStrategy"
        }
      }
    }
  }
}
